# The Python tooling's unit tests, on every change (seconds; no Qt needed), on GitHub's own runners:
# a public repository must not run pull requests on a self-hosted machine. Milestone 0 itself (a fresh
# Windows, end to end) is checked by following docs/m0.md on a clean machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:  # a newer push cancels the run it supersedes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --quiet -e ".[test]"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q
