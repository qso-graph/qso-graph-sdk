[project]
name = "qgsdk"
version = "0.1.1"
description = "QGSDK: installs the tools to build QSO Graph's software, by profile (logger, mcp), on Windows, Linux and macOS."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []  # aqtinstall is installed by the bootstrap, at the version manifest.json pins

[project.scripts]
qgsdk = "qgsdk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "certifi"]  # development only; what ships is bootstrap/tooling-requirements.txt

[build-system]
requires = ["setuptools>=77"]  # SPDX licence expression (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
